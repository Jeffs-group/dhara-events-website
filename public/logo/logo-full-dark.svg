    <path d="M48 24 H68 C88 24 102 38 102 58 C102 78 88 92 68 92 H48 Z M58 34 V82 H68 C82 82 92 72 92 58 C92 44 82 34 68 34 Z" fill="url(#fd-d-grad)" />
